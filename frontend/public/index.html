<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    
    <!-- ===== ICÔNES ===== -->
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/icon-192.png" />
    
    <!-- ===== PWA ===== -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <meta name="theme-color" content="#ff8c00" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PERSEE" />
    
    <!-- ===== VIEWPORT ===== -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=2.0, user-scalable=yes" />
    
    <!-- ===== MÉTA ===== -->
    <meta
      name="description"
      content="PERSEE - Plateforme Éducative Ivoirienne pour l'orientation, les quiz, l'échange de livres et le tutorat"
    />
    
    <title>PERSEE - Plateforme Éducative Ivoirienne</title>
    
    <!-- ===== FONTS ===== -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100vh;
        background: #1a472a;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
        overflow-x: hidden;
        overflow-y: auto;
      }
      
      #root {
        width: 100%;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        background: linear-gradient(135deg, #1a472a 0%, #2d6a4f 50%, #ff8c00 100%);
        overflow-y: auto;
        overflow-x: hidden;
      }
      
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      
      ::-webkit-scrollbar-track {
        background: rgba(255, 255, 255, 0.1);
      }
      
      ::-webkit-scrollbar-thumb {
        background: #ff8c00;
        border-radius: 3px;
      }
    </style>
  </head>
  <body>
    <noscript>Vous devez activer JavaScript pour utiliser PERSEE.</noscript>
    <div id="root"></div>
    
    <!-- ===== SERVICE WORKER DÉSACTIVÉ ===== -->
    <!-- Le Service Worker est désactivé pour éviter les problèmes de cache -->
    <script>
      // Service Worker désactivé - on ne l'enregistre pas
      console.log('ℹ️ Service Worker désactivé');
      
      // Si un Service Worker existe, on le désinstalle
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (let registration of registrations) {
            registration.unregister();
            console.log('🗑️ Service Worker désinstallé');
          }
        });
      }
    </script>
  </body>
</html>
